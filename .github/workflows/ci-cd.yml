name: Laravel CI/CD

on:
  push:
    branches: ["develop", "main", "feature/*"]
  pull_request:
    branches: ["develop", "main"]

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: pdo_mysql, mbstring

      - name: Instalar dependencias del proyecto
        run: composer install --no-interaction --prefer-dist

      - name: Copiar archivo .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Ejecutar migraciones y seeders
        run: php artisan migrate --seed --force

      - name: Ejecutar tests
        run: php artisan test --without-tty


  cd:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Subir al servidor vía FTP (Deploy)
        uses: SamKirkland/FTP-Deploy-Action@4.3.3
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: "/public_html/sistemaventa/"
